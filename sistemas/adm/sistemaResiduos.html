   <script>
   function modulo(opc){
   
	var arquivoURL = "php/montarModulo.php";
	obj = { modulo : opc };
	
	$.ajax( {
			type:'POST',
			url:arquivoURL,
			data: obj,
			dataType: 'html',
			success: function (data) { 
				$("#divCentral").html( data );
			},
			error: function( data){
				 console.log( data );
			}
		} 
	 );	
   
   }
	
	function enviar(area){
		var codigoUsuario = getVar("codigoUsuario");
		document.getElementById("formAluno").action = "areaAluno.html?area=" + area + "&codigoUsuario=" + codigoUsuario;
		document.getElementById("formAluno").submit();
	}
	
	function buscarDados( area ){
		var valor = getVar("codigoUsuario");
		var arquivoURL = '';

		if( area == 'geral' ){
			 arquivoURL = 'http://www.nffacademia.com.br/nff/mobile/dadosGerais.php?codigoUsuario=' + valor;
		}else if( area == 'avaliacao' ){
							arquivoURL = 'http://www.nffacademia.com.br/nff/mobile/avaliacao.php?codigoUsuario=' + valor;
		}else if( area == 'treino' ){
							arquivoURL = 'http://www.nffacademia.com.br/nff/mobile/treino.php?codigoUsuario=' + valor;
		}else if( area == 'frequencia' ){
							arquivoURL = 'http://www.nffacademia.com.br/nff/mobile/frequencia.php?codigoUsuario=' + valor;
		}else if( area == 'mensalidade' ){
							arquivoURL = 'http://www.nffacademia.com.br/nff/mobile/mensalidade.php?codigoUsuario=' + valor;
		}else if( area == 'compra' ){
							arquivoURL = 'http://www.nffacademia.com.br/nff/mobile/compras.php?codigoUsuario=' + valor;
		}else if( area == 'professor' ){ 
							arquivoURL = 'http://www.nffacademia.com.br/nff/mobile/conversa.php?codigoUsuario=' + valor;
              $("#ancora").focus();
		}

		$.ajax( {
				type:'GET',
				url:arquivoURL,
				dataType: 'html',
				success: function (data) { 
					$("#divCentral").html( data );
				},
				error: function( data){
					 console.log( data );
				}
			} 
		);	
		
	 $(".close").trigger('click');

	}				

	
      //knob

            regions: [{
              values: gdpData,
              scale: ['#000', '#000'],
              normalizeFunction: 'polynomial'
            }]
          },
          backgroundColor: '#eef3f7',
          onLabelShow: function(e, el, code) {
            el.html(el.html() + ' (GDP - ' + gdpData[code] + ')');
          }
        });
      });
