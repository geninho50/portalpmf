<script type="text/javascript">
	
    function acessarSistema(){
	  
	  if( $("#email").val() =="" ){
		  alert("Informe o login!");	
          $("#email").val("");		  
		  $("#senha").val("");
	  }else if( $("#senha").val() =="" ){
  			    alert("Informe a Senha !");		  
				$("#email").val("");		  
				$("#senha").val("");		  
	  }else{
        data = {
             "login"  : $("#email").val(),
             "senha"  : $("#senha").val()
        };
		
		data = $( this ).serialize() + "&" + $.param(data);


		$.ajax( {
		  type: "POST",
		  dataType: "json",
		  url: "../banco/loginJEM.php", 
		  data: data,
		  success: function( data ){
					 if( data['success'] == 1 ){
						 $("#email").val("");		  
						 $("#senha").val("");		  					 	

					     document.formLogin.action = "home.php";
						 $("#codigo").val( Base64Encode(data['codigoUsuario']) );
						 document.formLogin.submit();
					 }else{
					 	 alert( data['error'] );
						 $("#email").val("");		  
						 $("#senha").val("");
						 $("#login").focus;										 	
					 }         
				  },
		  error: function( data ){
				alert(data['error']);
		 	}
		} );
	  }	
    }

    function esqueceuSenha(){

	  if( $("#email").val() =="" ){
		  alert("Informe o login !");	
          $("#email").val("");		  
		  $("#senha").val("");
	  }else{
        data = {
             "login": $("#email").val(),
        };
		
		data = $( this ).serialize() + "&" + $.param(data);

		$.ajax( {
		  type: "POST",
		  dataType: "json",
		  url: "esqueceuSenha.php", 
		  data: data,
		  success: function( data ){
					 if( data != 0  ){
						 alert("Um link foi enviado para o seu email. Clique nele e crie sua nova senha !");
						 document.formIndex.action = "index.html";
						 document.formIndex.submit();
					 }else{
					     alert("O usuário não foi encontrado!"); 
						 $("#login").val("");		  
						 $("#senha").val("");
						 $("#login").focus;					
					 }            
				  },
		 error: function( data ){
			console.log( data );
		 }
		} 
		);
	  }	

    }

	function Base64Encode(str, encoding = 'utf-8') {
	   var bytes = new (TextEncoder || TextEncoderLite)(encoding).encode(str);        
	   return base64js.fromByteArray(bytes);
	}	

</script>
