<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/formulario.css">
        <!--fonte-->
        <link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;700&display=swap" rel="stylesheet">

        <!--bootstrap-->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">

        <!--scripts-->
        <script src="http://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>

        <script src="https//kit.fontawesome.com/bf7e05c402.js" crossorigin="anonymous"></script>-->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

        <!--progress bar-->
        <script src="js/progressbar.min.js"></script>

        <!--parallax-->
        <script src="https://cdn.jsdelivr.net/parallax.js/1.4.2/parallax.min.js"></script>
    </head>
    <body>
        
        <form class="row">
            <div class="col align-self-center">
                <div class="form-group">
                    <h5 id="subtitulo"><b>1. Dados do(a) agente público(a) aderente</b></h5>
                    <label id="labels">NOME:</label>
                    <input data-js="nome" id="nome" type="text" class="form-control" id="inputs" placeholder="Nome:" autocomplete="off">
                    <label id="labels">ENDEREÇO</label>
                    <input data-js="endereco" id="endereco" type="text" class="form-control" id="inputs" placeholder="Endereço Sede:">
                    <label id="labels">EMAIL</label>
                    <input data-js="email" id="email" type="text" class="form-control" id="inputs" placeholder="E-mail:">
                    <label id="labels">TELEFONE:</label>
                    <input data-js="telefone" id="telefone" type="text" class="form-control" id="inputs" maxlength="15" placeholder="Telefone: (99)99999-9999">
                    <label id="labels">REDE SOCIAL:</label>
                    <input data-js="redes" id="redes" type="text" class="form-control" id="inputs" placeholder="SITE/blog/Facebook/Instagram:">
                </div>
                <div class="form-group">
                    <label id="labels"><b>Natureza da Instituição:</b></label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Privada</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Pública</label><br>
                    <input id="checkbox" type="text" placeholder="Outra">
                </div>
                <div class="form-group">
                    <label id="labels"><b>Público Atendido:</b></label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Crianças</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Adolescentes/Jovens</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Adultos</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Idosos</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Público em geral</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Educadores</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Outros públicos específicos</label><br>
                </div>
                <div class="form-group">
                    <label id="labels"><b>Abrangência de atuação:</b></label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Florianópolis</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Grande Florianópolis</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Estado</label>
                </div>
                <div class="form-group">
                    <label id="labels"><b>Açoês de Educação Ambiental:</b></label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Formação Continuada</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">multirôes</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Oficinas</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Trilhas</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Cursos de Capacitação</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Produção Material Informativo</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Assessoria Técnica</label><br>
                    <input id="checkbox" type="checkbox">
                    <label id="labels">Promoção de Eventos</label><br>
                    <input id="outros" type="text" placeholder="Outro">
                </div>
                <div class="form-group">
					<label for="">Número de Colaboradores:</label>
					<input id="colaboradores" type="text" placeholder="Apenas números">
                </div>
                <h4><b>DADOS DO RESPONSÁVEL</b></h4>
                <div class="form-group">
                    <input id="nome" type="text" class="form-control" id="inputFinal" placeholder="Nome:">
					<input id="formacao" type="text" class="form-control" id="inputFinal" placeholder="formação:"><br>
                    <input id="atuacao" type="text" class="form-control" id="inputFinal" placeholder="Atuação na Instituição:">
					<input id="email" type="email" class="form-control" id="inputFinal" placeholder="E-mail"><br>
                    <input id="telefone" type="text" class="form-control" id="inputFinal" data-js="telefone" maxlength="15" placeholder="telefone 1:">
                    <input id="telefone" type="text" class="form-control" id="inputFinal" data-js="telefone" maxlength="15" placeholder="telefone 2:"><br>
                    <textarea id="outros" name="" class="form-control" id="inputFinal" cols="30" rows="10" placeholder="Outros dados ou informações"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" onclick="limparCampos();">Sair</button>
                    <button type="button" class="btn btn-primary" onclick="salvarUsuario();">Salvar</button>
                  </div>
            </div>
        </form>
        <script>
            function limparCampos()
            {
                $('#nome').val("");
                $('#endereco').val("");
                $('#email').val("");
                $('#telefone').val("");
                $('#redes').val("");
                $('#checkbox').val("");
                $('#outros').val("");
                $('#formacao').val("");
                $('#atuacao').val("");
            }

            function salvarUsuario(){
        
        if( $.trim(  $('#nome').val() ) == "" ){
            alert("Informe o nome!");
            $('#nome').focus();
            return false;
        }else if( $('#endereco').val() == "" ){
                alert("Informe o cnpj!");
                $('#cnpj').focus();
                return false;
        }/*else if( !eCNPJ($('#cnpj').val()) ){
            alert("CNPJ invalido!");
            $('#cnpj').focus;
            return false;
        }*/
         else if( $.trim( $('#email').val() ) == "" ){
                alert("Informe o email!");
                $('#email').focus();
                return false;
        }else if( $('#telefone').val() == "" && $('#celular').val() == "" ){
                alert("Informe o telefone ou celular!");
                $('#telefone').focus();
                return false;
        }else if( $('#rede').val() == "" ){
                alert("Informe alguma rede social!");
                $('#rede').focus();
                return false;
        }else {
        
            var arquivoURL = "banco/ongBD.php";
            
            if( confirm("Tem certeza que deseja finalizar o cadastro ? ") ){
                var form = $("#formulario").closest("form");
                var formData = new FormData(form[0]);
                            
                $.ajax({			
                        type: 'POST',
                        url: arquivoURL ,
                        dataType: 'json',
                        data: formData,
                        processData: false,
                        contentType: false,
                        success: function ( data ) {
                            if( data['success'] == 1 ){
                                alert(data['mensagem']);
                                limparCampos();
                            }else if( data['success'] == 2 ){
                                alert( data['mensagem'] );
                            }else{
                                alert( data['error'] );
                            }	
                        },				   
                        error: function ( data ) {
                            console.log(data);
                        }					
                });
            
            }
        }
    }  
        </script>
    <script src="js/cadastroDeEducadores.js"></script>
    </body>
</html>
