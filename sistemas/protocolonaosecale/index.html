<!DOCTYPE html>
<html>
<head>
<style>
  /* Estilos para o elemento iframe ocupar a tela inteira */
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
  <!-- O iframe ocupa a tela inteira -->
  <iframe src="https://aprovar.coddex.org/naosecale/"></iframe>
</body>
</html>
