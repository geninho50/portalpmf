<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Cadastro de Contratos</title>
</head>
    <style>
        .contrato {
            background-color: #f2f2f2;
            padding: 20px;
            width: 400px;
            border-radius: 8px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        form {
            display: grid;
            grid-gap: 10px;
        }
        label {
            font-weight: bold;
        }
        input[type="text"],
        input[type="date"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* adds padding into width */
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="contrato">
        <form action="teste.php" method="POST" enctype="multipart/form-data">
            <label>Sistema*</label>
            <input type="text" name="nomeComercial">

            <label>Vigência Inicial*</label>
            <input type="text" name="vigenciaInicial">

            <label>Vigência Final*</label>
            <input type="text" name="vigenciaFinal">

            <label>Fornecedor*</label>
            <input type="text" name="fornecedor">

            <label>Informações Contratuais*</label>
            <input type="text" name="infoContratuais">

            <label>Valor Anual*</label>
            <input type="text" name="custoAnual">

            <label>Fiscal E-GOV*</label>
            <input type="text" name="superEgov" placeholder="Divida os Fiscais Internos com Vírgulas">

            <label>Fiscal*</label>
            <input type="text" name="superFiscal" placeholder="Divida os Fiscais com Vírgulas">

            <label>Gestor*</label>
            <input type="text" name="superGestor" placeholder="Divida os Gestores com Vírgulas">

            <label>Secretaria*</label>
            <input type="text" name="secretaria" placeholder="Divida as Secretarias com Vírgulas">
            
            <label for="documentos">Documentos</label>
            <input type="file" name="documentos[]" id="documentos" multiple>

            <label>Categoria*</label>
            <input type="text" name="classContrato">

            <label>Nome Usual</label>
            <input type="text" name="nomeUsual">

            <label>Objeto</label>
            <input type="text" name="objetoContrato">

            <label>Observações</label>
            <input type="text" name="observacaoContrato">

            <input type="submit" value="Enviar">
        </form>
    </div>

</body>



    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
