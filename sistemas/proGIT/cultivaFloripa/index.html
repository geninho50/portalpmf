function AbrirItem(opc){
  var pagina = "";
  
  $('#btnmenu').hide;
  
  
	  if( opc == 1 ){ 
		  pagina = "paginas/sobre.php";
	  }else if( opc == 2 ){ 
		  pagina = "paginas/cursos-oficinas.php";
	  }else if( opc == 3 ){ 
		  pagina = "paginas/feiras-livres.php";
	  }else if( opc == 4 ){ 
		  pagina = "paginas/feiras-organicas.php";
	  }else if( opc == 5 ){ 
		  pagina = "paginas/historia-feiras.php";
	  }else if( opc == 6 ){ 
		  pagina = "paginas/viveiros-municipais.php";
	  }else if( opc == 7 ){ 
		  pagina = "paginas/contato.php";
	  }else if( opc == 8 ){ 
		  pagina = "paginas/horta-comunitaria.php";
	  }else if( opc == 9 ){ 
		  pagina = "paginas/hortas-institucionais.php";
	  }else if( opc == 22 ){ 
		  pagina = "paginas/centrosaude.php";
	  }else if( opc == 18 ){ 
		  pagina = "paginas/hortainsti.php";
	  }else if( opc == 34 ){

	  }else if( opc == 25 ){

		  pagina = "paginas/cadastreSuaHorta.php";
	  }
	  else{
	     alert("Em breve !");
	  }
	  
	  

	 if( pagina !="" ){ 
		 $.ajax( {
				type:'GET',
				url:pagina,
				dataType: 'html',
				success: function (data) {
					 document.getElementById('conteudo').style.display = 'none';	
					 document.getElementById('notícias').style.display = 'none';					 
					$('#abertura').html( data );
				},
				error: function( data){
					 console.log( data );
				}
			} 
		 );	
	 }

}
