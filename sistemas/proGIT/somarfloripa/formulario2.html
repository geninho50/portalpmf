    <body>
        <center><img src="images/logo_pmf.jpg" id="logoPrefeitura" alt="">
            <hr>
            <h4 id="titulo">TERMO DE TRABALHO INDIVIDUALIZADO</h4>
            <h4 id="titulo">(Art. 12, Instrução Normativa N° 002/SMA/2021)</h4></center>
        <form class="row">
            <div class="col align-self-center">
                <div class="form-group">
                    <h5 id="subtitulo"><b>1. Dados do(a) agente público(a) aderente</b></h5>
                    <label id="labels"></label>
                    <input type="text" class="form-control" id="inputs" placeholder="Nome:">
                    <label id="labels"></label>
                    <input type="number" class="form-control" id="inputs" placeholder="Matrícula:">
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="inputs" placeholder="Cargo:">
                </div>
                <div class="form-group">
                    <input type="number" class="form-control" id="inputs" placeholder="Lotação:">
                </div>
                <div class="form-group">
                    <h5 id="subtitulo"><b>2. Declaração</b></h5>
                    <label id="subtitulo">Declaro que recebi do(a) <input type="text" placeholder="nome do setor">&nbsp;, os<br>
                    processos administrativos e/ou documentos físicos abaixo especificados:</label><br>
                    <textarea name="" id="" cols="45" rows="5" placeholder="N° do processo/documento"></textarea>
                    <textarea name="" id="" cols="45" rows="5" placeholder="Descrição"></textarea>
                </div>
                <div class="form-group">
                    <h5 id="subtitulo"><b>3. Termo de compromisso e assinatura</b></h5>
                    <label id="labels">Fico responsável por prover o transporte, a guarda e a conservação dos processos e<br>
                    documentos recebidos, ciente de que caso não devolvidos ou se, restituídos,<br>
                    apresentarem danos ou qualquer irregularidade, sem que haja justificativa, estou<br>
                    sujeito(a) às medidas administrativas e disciplinares cabíveis, inclusive o desligamento<br>
                    do Trabalho Não Presencial.</label>
                </div>
                <p></p>
                <label id="subtitulo">Florianópolis <input type="number" placeholder="somente números">&nbsp;de <input type="text">&nbsp;de <input type="number" placeholder="somente números">.</label><br>
                <input type="text" placeholder="Nome" id="fin"><br>
                <input type="number" placeholder="Matrícula" id="fin">
            </div>
        </form>
        <hr>
        <center><label id="endereço">Rua Conselheiro Mafra n° 656 - Florianópolis - SC<br>
        Telefone: (48) 3251-5900 - Site: <a href="https://www.pmf.sc.gov.br/" target="_blank">www.pmf.sc.gov.br</a></label></center>
