		//ESpecificar o tipo da horta
		function validarTipoHorta(){
				var tipoHorta = document.getElementsByName('tipoHorta');
				var genValue = false;

				for(var i=0; i<tipoHorta.length;i++){
					if(tipoHorta[i].checked == true){
						genValue = true;
					}
				}
				if(!genValue){
					alert("Especifique o tipo da horta!");
					$('#tipoHorta').focus();
				}else if($.trim( $("#tipoHorta").value="I")){
					alert("Especifique o tipo de instituição!")
					$('#tipoHortaInst').focus();
				}
				return false;
		}
