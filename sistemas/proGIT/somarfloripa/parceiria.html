<body>
    <script>
        var arquivoURLMenu = 'php/montarDivCabecalho.php';
        var arquivoURLRodape = 'php/montarDivRodape.php';        
        
        montarDivRodape();
        
        function montarDivRodape(){
            $.ajax( {
					type:'POST',
					url:arquivoURLRodape,
					dataType: 'html',
					success: function (data) { 
						$("#divRodape").html( data );
					},
					error: function( data){
						 console.log( data );
					}
				} 
			 );	
        }

        montarMenu();

        function montarMenu(){
			 $.ajax( {
					type:'POST',
					url:arquivoURLMenu,
					dataType: 'html',
					success: function (data) { 
						$("#barraMenu").html( data );
					},
					error: function( data){
						 console.log( data );
					}
				} 
			 );	
        }
    </script>
    <header>
        <div class="menu-bar" id="barraMenu">

        </div>
    </header>

    <div style="background-color:#E0E0E0;" id="divRodape">

    </div>
