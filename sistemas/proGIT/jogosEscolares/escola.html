<script type="text/javascript">
		    $("#telefone").mask("(99) 99999999?9");

function buscarCEP() {


				var cep = $("#cep").val().replace(/\D/g, '');
			   
				if ( cep !== "" && $("#logradouro").val() === "" )  {
				 
					 $("#btnCEP").val("Processando ..."); 
				 
					var validacep = /^[0-9]{8}$/;
					 
					if(validacep.test(cep)) {
						 
						var urlCEP = "https://viacep.com.br/ws/" + cep + "/json/";
						$.ajax( {
							type: "POST",
							dataType: "jsonp",
							url: urlCEP,
							crossDomain: true,
							contentType:"application/json",
							success: function( dados )  {
								$("#logradouro").val(dados.logradouro + " " + dados.complemento);
								$("#bairro").val(dados.bairro);
								$("#municipio").val(dados.localidade);
								$("#estado").val(dados.uf);              
							},
							error : function(dados){
								alert("Erro no retorno de dados !");
							}
						} );
					 
						$("#btnCEP").val("Buscar");
					 
					}
				} 
			 }



function salvar(){
		if( $('#cnpj').val() == "" ){
			alert("Informe o CNPJ!");
			$('#cnpj').focus();
			return false;
		}else if( $('#nome').val() == "" ){
			alert("Informe o nome da escola!");
			$('#nome').focus();
			return false;
		}else if( $('#responsavel').val() == "" ){
			alert("Informe o nome do Responsável!");
			$('#responsavel').focus();
			return false;
		}else if( $('#telefone').val() == "" ){
			alert("Informe o telefone!");
			$('#telefone').focus();
			return false;
		}else if( $('#celular').val() == "" ){
			alert("Informe o Celular(Whatsapp)!");
			$('#celular').focus();
			return false;
		}else if( $('#cep').val() == "" ){
			alert("Informe o CEP!");
			$('#cep').focus();
			return false;
		}else if( $('#logradouro').val() == "" ){
			alert("Informe o endereço!");
			$('#logradouro').focus();
			return false;	
		}else if( $('#bairro').val() == "" ){
			alert("Informe o bairro!");
			$('#bairro').focus();
			return false;
		}else if( $('#email').val() == "" ){
			alert("Informe o email (login)!");
			$('#email').focus();
			return false;
		}else if( $('#senha').val() == "" ){
			alert("Informe a senha!");
			$('#senha').focus();
			return false;
		}else if( $('#senha2').val() == "" ){
			alert("Informe a senha novamente!");
			$('#senha2').focus();
			return false;
		}else if( $('#senha2').val() != $('#senha').val() ){
			alert("As senhas são diferentes!");
			$('#senha2').val("");
			$('#senha').val("");
			$('#senha').focus();
			return false;
		}else if( $('#regiao').val() == "" ){
			alert("Informe a região!");
			$('#regiao').focus();
			return false;
		}else{
			$('#error').addClass('hide');
			var err = '';
			

			var obj = {
				cnpj                : limpezaDeDocumento( $('#cnpj').val() ),
				nome                : $('#nome').val(),
				responsavel         : $('#responsavel').val(),
				telefone            : limpezaDeDocumento( $('#telefone').val() ),
				celular             : limpezaDeDocumento( $('#celular').val() ),
				cep                 : limpezaDeDocumento( $('#cep').val() ),		
				logradouro          : $('#logradouro').val(),
				numero              : $('#numero').val(),
				complemento         : $('#complemento').val(),
                bairro              : $('#bairro').val(),
				email               : $('#email').val(),
				senha               : $('#senha').val(),
				regiao              : $('#regiao').val()
				
			};
            
			$.ajax({			
				   type: "POST",
				   url: "../banco/cadastrarJOGOSECOLARES.php",
				   dataType: "json",
				   data: obj,
				   success: function ( data ) {
				   	console.log(data);
					   if( data['success'] == 1 ){
						   alert("Informações enviadas com SUCESSO.");

							   $('#cnpj').val("");
						       $('#nome').val("");
						       $('#responsavel').val("");
						       $('#telefone').val("");		 
							   $('#celular').val("");						  
							   $('#cep').val("");		
							   $('#logradouro').val("");
							   $('#complemento').val("");
						       $('#bairro').val("");
							   $('#numero').val("");
							   $('#email').val("");	  		  
							   $('#senha').val("");	
							   $('#regiao').val("");	

							document.formulario.action = "login.html";
							document.formulario.submit();

					   }else{
						   alert(data['error']);   
					   }
					  				   	
					},				   
				   error: function ( data ) {
					   alert( data['error'] );
					   console.log(data);
				   }
				
			});
			
		}
    }
