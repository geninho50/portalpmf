<script src="../banco/js/base64.min.js"></script>
<script type="text/javascript">

    function acessarSistema(){
	  
	  if( $("#login").val() =="" ){
		  alert("Informe o CPF ou Email !");	
          $("#login").val("");		  
		  $("#nascimento").val("");
	  }else{
        data = {
             "login"  : $("#login").val(),
             "fone"  : $("#fone").val()
        };
		
		data = $( this ).serialize() + "&" + $.param(data);
		$.ajax( {
		  type: "POST",
		  dataType: "json",
		  url: "../banco/loginParaInscricao.php", 
		  data: data,
		  success: function( data ){
					 if( data != '0'  ){
						 var codigo = Base64Encode(data);							 
						 document.formIndex.action = "admin/cadastroFilaEspera.php?codigo=" + codigo;
						 document.formIndex.submit();
					 }else{
					     alert("Não existe nenhum usuário !"); 
						 $("#login").val("");		  
						 $("#fone").val("");
						 $("#login").focus;
					 }            
				  },
		 error: function( data ){
			console.log( data );
		 }
		} 
		);
	  }
	  
    }

	function Base64Encode(str, encoding = 'utf-8') {
	   var bytes = new (TextEncoder || TextEncoderLite)(encoding).encode(str);        
	   return base64js.fromByteArray(bytes);
	}	

</script>
