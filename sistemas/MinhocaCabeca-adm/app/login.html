<script src="../banco/js/base64.min.js"></script>
<script type="text/javascript">

    function acessarSistema(){
	  
	  if( $("#login").val() =="" ){
		  alert("Informe o login !");	
          $("#login").val("");		  
		  $("#senha").val("");
	  }else if( $("#senha").val() =="" ){
  			    alert("Informe a Senha !");		  
				$("#login").val("");		  
				$("#senha").val("");		  
	  }else{
        data = {
		     "sistema": "cliente",
			 "perfil" : "P",
             "login"  : $("#login").val(),
             "senha"  : $("#senha").val()
        };
		
		data = $( this ).serialize() + "&" + $.param(data);

		$.ajax( {
		  type: "POST",
		  dataType: "json",
		  url: "../../banco/loginMNC.php", 
		  data: data,
		  success: function( data ){
					 if( data != '0' && data !='999999'  ){
					     document.formIndex.action = "sistema.php";
						 var codigoUsuario = Base64Encode(data);						 
						 $("#codigoUsuario").val( codigoUsuario );
						 document.formIndex.submit();
						 
					 }else if( data == '999999' ){
					     alert("Este usuário está desativado !"); 
						 $("#login").val("");		  
						 $("#senha").val("");
						 $("#login").focus;  
					 }else{
					     alert("O usuário ou senha, está incorreto !"); 
						 $("#login").val("");		  
						 $("#senha").val("");
						 $("#login").focus;
					 }            
				  },
		 error: function( data ){
			console.log( data );
		 }
		} 
		);
	  }	

    }

    function esqueceuSenha(){

	  if( $("#login").val() =="" ){
		  alert("Informe o login !");	
          $("#login").val("");		  
		  $("#senha").val("");
	  }else{
        data = {
             "login": $("#login").val(),
        };
		
		data = $( this ).serialize() + "&" + $.param(data);

		$.ajax( {
		  type: "POST",
		  dataType: "json",
		  url: "esqueceuSenha.php", 
		  data: data,
		  success: function( data ){
					 if( data != 0  ){
						 alert("Um link foi enviado para o seu email. Clique nele e crie sua nova senha !");
						 document.formIndex.action = "index.html";
						 document.formIndex.submit();
					 }else{
					     alert("O usuário não foi encontrado!"); 
						 $("#login").val("");		  
						 $("#senha").val("");
						 $("#login").focus;					
					 }            
				  },
		 error: function( data ){
			console.log( data );
		 }
		} 
		);
	  }	

    }

	function Base64Encode(str, encoding = 'utf-8') {
	   var bytes = new (TextEncoder || TextEncoderLite)(encoding).encode(str);        
	   return base64js.fromByteArray(bytes);
	}	

</script>
